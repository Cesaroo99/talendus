name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Lancer pytest
        run: python -m pytest -q
      - name: Vérifier les gardes-fous de production
        run: python -c "from app.boot import assert_runtime_safe, normalize_database_url; assert normalize_database_url('postgres://u:p@h/db').startswith('postgresql+psycopg://')"

  image:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image de production
        run: docker build -t talendus:ci .

  merge:
    name: Fusionner vers main (après tests)
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'cursor/')
    needs: [test, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fusionner la pull request Cursor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" --squash --delete-branch
