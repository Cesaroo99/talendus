# Talendus — production (Render)
# Déploiement automatique à chaque commit sur `main`.
# La CI GitHub reste le garde-fou : les PR `cursor/*` ne fusionnent qu'après tests verts.
# On n'utilise pas checksPass : un squash-merge GitHub (GITHUB_TOKEN) ne relance pas la CI
# sur main, donc Render ne voyait aucun check et ne déployait pas.
# Première mise en ligne : Dashboard Render → New → Blueprint → ce dépôt, branche main.

databases:
  - name: talendus-db
    plan: basic-256mb
    region: ohio
    postgresMajorVersion: "17"
    databaseName: talendus
    user: talendus
    ipAllowList: []

services:
  - type: web
    name: talendus-web
    runtime: docker
    plan: starter
    region: ohio
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    # Le DNS Namespro doit pointer ici (pas de transfert URL / parking) :
    # A @ → 216.24.57.1  ·  CNAME www → talendus-web.onrender.com  ·  aucun AAAA
    domains:
      - talendus.ca
      - www.talendus.ca
    disk:
      name: talendus-files
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: STORAGE_DIR
        value: /var/data
      - key: STORAGE_BACKEND
        value: local
      - key: EMAIL_ENABLED
        value: "false"
      - key: TRACKING_ENABLED
        value: "false"
      - key: SEO_CANONICAL_HOST
        value: https://talendus.ca
      - key: FRONTEND_URL
        value: https://talendus.ca
      - key: ADMIN_EMAIL
        value: lea.super@talendus.ca
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: talendus-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
