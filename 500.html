<!DOCTYPE html>
<html lang="fr-CA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Talendus — service momentanément indisponible</title>
  <style>
    :root { --navy:#0b1f3a; --ice:#eef3f8; --orange:#ff6b00; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif; background: var(--navy); color:#fff; padding:24px; }
    .card { max-width: 520px; }
    .kicker { letter-spacing:.12em; text-transform:uppercase; font-size:12px; color:#ffb37a; font-weight:700; }
    h1 { font-size: clamp(28px, 5vw, 40px); line-height:1.15; margin:12px 0 16px; }
    p { color: rgba(255,255,255,.82); font-size:17px; line-height:1.5; margin:0 0 28px; }
    a { display:inline-flex; align-items:center; min-height:48px; padding:0 20px; border-radius:10px;
      background: var(--orange); color:#fff; text-decoration:none; font-weight:700; }
  </style>
</head>
<body>
  <div class="card">
    <div class="kicker">Talendus</div>
    <h1>Le site se reconnecte.</h1>
    <p>Le service est occupé un instant (mise à jour ou base de données). Réessayez dans quelques secondes — rien n’est perdu.</p>
    <a href="/">Retour à l’accueil</a>
  </div>
</body>
</html>
