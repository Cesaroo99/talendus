plugins {
    id "com.android.application"
}
android {
    namespace "ca.talendus.app"
    compileSdk 34
    defaultConfig {
        applicationId "ca.talendus.app"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
